  12.6  S6  glitch: grito em meio-tom, padrão "MEDO", "DE FICAR VELHO"                                            | glitch + boom
  14.4  S7  flash; mealheiro, moedas caem; "HÁ SEMPRE / ALGO PARA TE / VENDER"                                    | impact, moedas
  16.8  S8  "CREMES" (bisnaga) → 18.0 "SÉRUNS" (conta-gotas) → 19.2 "TRATAMENTOS" letras em arco                  | impacts, pops
  20.4  S9  microscópio desce, 21.0 luz acende: "NÃO INVENTOU / O ENVELHECIMENTO"                                 | swoosh, boom
  23.4  S10 coração a bater: "SÓ APRENDEU / A LUCRAR / COM O MEDO."                                               | hit, batimentos
  25.6  "MEDO." atravessa a câmara → S11 "SEGUE A / AFRICA / NEWS", linha escrita letra a letra                   | swoosh, hit, ticks, ding

const W = 1080, H = 1920, DUR = 28.8, B = 0.6;

// ---- helpers da skill ----
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);

function txt(parent, s, cls, size, extra = '') { const d = document.createElement('div'); d.className = 'e ' + cls; d.style.fontSize = size + 'px'; d.style.cssText += extra; d.textContent = s; parent.appendChild(d); return d; }
function put(el, x, y, s = 1, r = 0, o = 1) {
  el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`;
  el.style.opacity = o; el.style.visibility = o <= 0.002 ? 'hidden' : 'visible';
}
function show(el, on) { el.style.display = on ? 'block' : 'none'; }
// entrada de palavra: blur + subida + overshoot; saída rápida
function word(el, t, t0, t1, x, y, opt = {}) {
  const k = spring(t - t0, opt.w || 16, opt.z || .6);
  let o = clamp((t - t0) / .1) * (1 - seg(t, t1, t1 + .15));
  if (t < t0) o = 0;
  const s = lerp(opt.s0 ?? .7, 1, k) * (opt.s || 1);
  put(el, x + (1 - k) * (opt.dx || 0), y + (1 - k) * (opt.dy ?? 50), s, opt.r || 0, o);
  const bl = (1 - clamp((t - t0) / .18)) * 10;
  el.style.filter = bl > .3 && t >= t0 ? `blur(${bl.toFixed(1)}px)` : 'none';
}
const NS = 'http://www.w3.org/2000/svg';
function svg(parent, w = W, h = H) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'full'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.style.width = w + 'px'; s.style.height = h + 'px'; parent.appendChild(s); return s; }
function path(s, d, stroke, width, dash) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', width); p.setAttribute('stroke-linecap', 'round'); if (dash) p.setAttribute('stroke-dasharray', dash); s.appendChild(p); return p; }
// desenha um traço de 0 a 1 (para tracejados usa uma máscara de comprimento)
function draw(p, k) { const L = p.__L ??= p.getTotalLength(); if (!p.getAttribute('stroke-dasharray') || p.__solid) { p.__solid = true; p.setAttribute('stroke-dasharray', `${L} ${L}`); p.setAttribute('stroke-dashoffset', L * (1 - k)); } p.style.opacity = k > 0 ? 1 : 0; }

// ---- fundos pré-renderizados ----
function radial(c, inner, outer, cx = 540, cy = 860, r = 1250) {
  const g = c.getContext('2d'), gr = g.createRadialGradient(cx, cy, 50, cx, cy, r);
  gr.addColorStop(0, inner); gr.addColorStop(.55, outer[0]); gr.addColorStop(1, outer[1]);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
{ const g = vig.getContext('2d'), gr = g.createRadialGradient(540, 900, 380, 540, 960, 1300); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.78)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
const dots = document.createElement('canvas'); dots.width = dots.height = 12;
{ const g = dots.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.arc(6, 6, 1.6, 0, 7); g.fill(); }

const w1 = img(s1, 'old_woman_f.png', 600);
const t1a = txt(s1, 'E SE', 'big', 190), t1b = txt(s1, 'ENVELHECER', 'big', 158);
const t1w = ['NUNCA', 'FOI', 'O', 'PROBLEMA'].map(s => txt(s1, s, 'big', 64));
const t1pos = [[190, 330], [880, 300], [210, 520], [800, 760]];
// faixa ondulada + jovem recortada por ela
const band = layer(), bandSvg = svg(band);
const bandPoly = document.createElementNS(NS, 'polygon'); bandPoly.setAttribute('fill', '#b3121c'); bandSvg.appendChild(bandPoly);
const bandEdge = document.createElementNS(NS, 'polyline'); bandEdge.setAttribute('fill', 'none'); bandEdge.setAttribute('stroke', 'rgba(255,200,200,.55)'); bandEdge.setAttribute('stroke-width', 7); bandSvg.appendChild(bandEdge);
const s2 = layer();
const young = img(s2, 'young_f.png', 820), skull2 = img(s2, 'skull.png', 470);
const seam = document.createElement('div'); seam.className = 'e'; seam.style.cssText = 'width:6px;height:900px;background:linear-gradient(#0000,#000a 20%,#000a 80%,#0000)'; s2.appendChild(seam);
const t2 = [['MAS', 'big red', 120], ['O MEDO', 'big', 96], ['DE ENVELHECER', 'big', 66], ['ERA.', 'big', 96]].map(([s, c, z]) => txt(s2, s, c, z));
function bandPts(x0, x1, yc, hh, ph) {
  const top = [], bot = [];
  for (let i = 0; i <= 48; i++) { const x = lerp(x0, x1, i / 48), w = Math.sin(x * .006 + ph) * 70 + Math.sin(x * .013 + ph * 1.7) * 26; top.push([x, yc - hh + w]); bot.push([x, yc + hh + w * .7]); }
  return { top, all: top.concat(bot.reverse()) };
}
// S3/S4

const w3wrap = document.createElement('div'); w3wrap.className = 'e'; w3wrap.style.cssText = 'width:631px;height:839px'; s3.appendChild(w3wrap);

const wrinkSvg = svg(w3wrap, 631, 839);

const wrLen = wr.map(p => p.getTotalLength());
const t3a = txt(s3, 'A INDÚSTRIA', 'big', 150), t3b = txt(s3, 'DA BELEZA', 'big', 150);
const t3c = txt(s3, 'DÉCADAS', 'big', 120), t3n = txt(s3, '1950', 'big', 190);
const cosm = img(s3, 'cosmetics.png', 470);
const ringSvg = svg(s3), ring1 = path(ringSvg, 'M300 930 C 620 880, 660 1500, 260 1520 C -120 1540, -60 950, 330 940', 'rgba(237,227,211,.9)', 9, '2 14'), ring2 = path(ringSvg, 'M310 920 C 640 900, 640 1510, 250 1500 C -100 1530, -80 960, 320 925', 'rgba(237,227,211,.6)', 4);
const band2 = layer(), band2Svg = svg(band2);
const band2Poly = document.createElementNS(NS, 'polygon'); band2Poly.setAttribute('fill', '#b3121c'); band2Svg.appendChild(band2Poly);
const band2Edge = document.createElementNS(NS, 'polyline'); band2Edge.setAttribute('fill', 'none'); band2Edge.setAttribute('stroke', 'rgba(255,200,200,.55)'); band2Edge.setAttribute('stroke-width', 7); band2Svg.appendChild(band2Edge);
const t4a = txt(s3, 'RUGAS.', 'big', 150), t4b = txt(s3, 'DEFEITOS.', 'big red', 150);
// S5

const t5a = txt(s5, 'E A', 'big', 110), t5b = txt(s5, 'IDADE', 'big', 330);
const t5c = txt(s5, 'ALGO A', 'big', 62), t5d = txt(s5, 'COMBATER', 'big', 62);
const s5svg = svg(s5);
const circ = path(s5svg, 'M790 1035 C 980 1030, 990 1225, 790 1230 C 600 1235, 590 1045, 805 1028', 'rgba(237,227,211,.95)', 6);
const arrow = path(s5svg, 'M900 1250 C 940 1330, 900 1400, 840 1420 M860 1395 L838 1422 L872 1430', 'rgba(237,227,211,.95)', 6);
const scratch = ['M60 140 L70 420', 'M110 120 L100 380', 'M30 260 L190 250', 'M930 1500 L1010 1780', 'M980 1480 L960 1800', 'M880 1640 L1060 1600', 'M900 120 L1050 260', 'M1040 110 L890 270'].map(d => path(s5svg, d, '#d4242e', 7));
// S6
const s6 = layer();
const s6bg = document.createElement('div'); s6bg.className = 'e'; s6bg.style.cssText = 'width:2200px;height:2600px'; s6.appendChild(s6bg);
const rows6 = Array.from({ length: 11 }, (_, i) => { const d = txt(s6bg, Array(9).fill('MEDO').join(' '), 'outline', 200); d.style.left = '0'; d.style.top = (i * 240) + 'px'; return d; });
const scr = [0, 1, 2].map(i => { const im = img(s6, 'scream_ht.png', 900); im.style.clipPath = `inset(${i * 33.3}% 0 ${100 - (i + 1) * 33.4}% 0)`; return im; });
const t6a = txt(s6, 'MEDO', 'big', 270), t6b = txt(s6, 'DE FICAR VELHO', 'big', 112);
const s6svg = svg(s6);
const cross6 = ['M120 1180 L120 1460 M40 1290 L210 1280', 'M930 260 L940 520 M860 380 L1030 370', 'M150 300 L380 340', 'M720 1640 L1000 1600'].map(d => path(s6svg, d, '#e0303a', 9));
const scan = document.createElement('div'); scan.className = 'L'; scan.style.background = 'repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 5px)'; s6.appendChild(scan);
// S7
const s7 = layer();
const piggy = img(s7, 'piggy.png', 520);
const coins = Array.from({ length: 6 }, (_, i) => ({ e: img(s7, 'coin.png', 200 + (i % 3) * 30), a: i / 6 * 6.283 + .4 }));
const t7a = txt(s7, 'HÁ SEMPRE', 'big', 130), t7b = txt(s7, 'ALGO PARA TE', 'big', 86), t7c = txt(s7, 'VENDER', 'big', 255);
const flash = document.createElement('div'); flash.className = 'L'; flash.style.background = '#f4ece0'; cam.appendChild(flash);
// S8
const s8 = layer();
const tube = img(s8, 'tube.jpg', 1080), drop = img(s8, 'dropper.jpg', 1080);
const bub = Array.from({ length: 14 }, (_, i) => { const r = rng(500 + i), d = document.createElement('div'), z = 30 + r() * 110; d.className = 'e'; d.style.cssText = `width:${z}px;height:${z}px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.85) 0 8%, rgba(120,20,25,.35) 30%, rgba(20,0,0,.75) 75%, rgba(255,200,200,.5) 92%, transparent 100%)`; s8.appendChild(d); return { e: d, x: r() * W, y: 600 + r() * 1400, v: 60 + r() * 140, ph: r() * 6 }; });
const t8y1 = txt(s8, '2026', 'ital', 54), t8y2 = txt(s8, 'CREMES', 'ital', 54);
const t8a = txt(s8, 'CREMES', 'big', 210), t8b = txt(s8, 'SÉRUNS', 'big', 210);
const cosm8 = img(s8, 'cosmetics.png', 700), w8 = img(s8, 'old_woman_f.png', 480);
const TR = 'TRATAMENTOS'.split('').map(ch => txt(s8, ch, 'big', 170));
// S9
const s9 = layer();
const beam = document.createElement('canvas'); beam.width = W; beam.height = H; beam.className = 'full';
{ const g = beam.getContext('2d'); const gr = g.createLinearGradient(0, 640, 0, 1800); gr.addColorStop(0, 'rgba(255,214,150,.85)'); gr.addColorStop(.5, 'rgba(255,170,100,.35)'); gr.addColorStop(1, 'rgba(255,140,80,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(560, 650); g.lineTo(680, 650); g.lineTo(1060, 1800); g.lineTo(140, 1800); g.closePath(); g.filter = 'blur(14px)'; g.fill(); }
const micro = img(s9, 'microscope.png', 760);
s9.appendChild(beam);
const t9s = txt(s9, 'A INDÚSTRIA', 'ital', 76), t9a = txt(s9, 'NÃO INVENTOU', 'big', 118), t9b = txt(s9, 'O ENVELHECIMENTO', 'big', 90);
// S10
const s10 = layer();
const glow = document.createElement('canvas'); glow.width = glow.height = 1000; glow.className = 'e';
{ const g = glow.getContext('2d'), gr = g.createRadialGradient(500, 500, 0, 500, 500, 500); gr.addColorStop(0, 'rgba(255,150,160,.55)'); gr.addColorStop(1, 'rgba(255,120,130,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1000, 1000); }
s10.appendChild(glow);
const heart = img(s10, 'heart.png', 600);
const t10a = txt(s10, 'SÓ APRENDEU', 'big', 112), t10b = txt(s10, 'A LUCRAR', 'big', 170), t10c = txt(s10, 'com o', 'ital', 90), t10d = txt(s10, 'MEDO.', 'big', 300);
// S11
const s11 = layer();
const t11a = txt(s11, 'segue a', 'ital', 96), t11b = txt(s11, 'AFRICA', 'big', 250), t11c = txt(s11, 'NEWS', 'big red', 250);
const rule = document.createElement('div'); rule.className = 'e'; rule.style.cssText = 'height:3px;width:640px;background:#EDE3D3;transform-origin:0 50%'; s11.appendChild(rule);
const t11d = txt(s11, '', 'big', 42, 'letter-spacing:.28em');
const LINE = 'HISTÓRIAS QUE FAZEM PENSAR';

const layers = [s1, band, s2, s3, band2, s5, s6, s7, flash, s8, s9, s10, s11];
// câmara: push-in contínuo por cena + tremores
const shakeAt = [3.0, 5.4, 10.2, 12.6, 13.2, 13.8, 14.4, 16.8, 18.0, 21.0, 23.4, 26.0];
function shake(t) { let x = 0, y = 0; for (const s of shakeAt) { const d = t - s; if (d >= 0 && d < .35) { const a = Math.exp(-d * 12) * 14; x += Math.sin(d * 90) * a; y += Math.cos(d * 77) * a; } } return [x, y]; }

// ================= SEEK =================
window.seek = function (t) {
  t = clamp(t, 0, DUR - 1e-4);
  layers.forEach(l => show(l, false));
  const [sx, sy] = shake(t);
  let camS = 1, camX = 0, camY = 0;
  bgDark.style.opacity = clamp(seg(t, 20.2, 20.6) - seg(t, 25.7, 26.2));

  // ---------- S1 + faixa (0 – 3.4) ----------
  if (t < 3.4) {
    show(s1, true);
    camS = 1 + t * .035;
    qs.forEach((q, i) => { const o = clamp(t / .4 - i * .05) * .85 * (1 - seg(t, 2.6, 3.0)); put(q.e, q.x, q.y + q.vy * t, 1, q.r0 + q.vr * t, o); q.e.style.filter = q.bl ? `blur(${q.bl}px)` : 'none'; });
    const wk = spring(t, 6, 1);
    put(w1, 540, 940 - (1 - wk) * 40, lerp(1.08, 1, wk), 0, clamp(t / .35));
    word(t1a, t, 0.05, 99, 300, 1430, { dx: -80, dy: 0 });
    word(t1b, t, 0.35, 99, 540, 1600, { dx: 0, dy: 60 });
    t1w.forEach((e, i) => word(e, t, .9 + i * .3, 99, ...t1pos[i], { dy: 30 }));
    // faixa
    if (t > 2.2) {
      show(band, true); show(s2, true);
      const x0 = lerp(1250, -260, ease(seg(t, 2.25, 2.95))), hh = lerp(170, 1300, ease(seg(t, 2.92, 3.35)));
      const { top, all } = bandPts(x0, 1500, 960, hh, t * 2.2);
      const pts = all.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
      bandPoly.setAttribute('points', pts); bandEdge.setAttribute('points', top.map(p => p.join(',')).join(' '));
      bandPoly.style.opacity = 1; bandEdge.style.opacity = 1 - seg(t, 2.95, 3.2);
      s2.style.clipPath = `polygon(${all.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',')})`;
    }
  }
  // ---------- S2 (3.0 – 5.6) ----------

// ================= ÁUDIO =================
function b64buf(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
window.buildAudio = async function (ctx) {
  const sfx = {}; for (const k in SFX) sfx[k] = await ctx.decodeAudioData(b64buf(SFX[k]));
  const master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  const music = ctx.createGain(); music.gain.value = .55; music.connect(master);
  const fxBus = ctx.createGain(); fxBus.gain.value = .8; fxBus.connect(master);
  const R = rng(42);
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  function play(name, at, gain = 1, dur, rate = 1) { const s = ctx.createBufferSource(); s.buffer = sfx[name]; s.playbackRate.value = rate; const g = ctx.createGain(); g.gain.value = gain; s.connect(g); g.connect(fxBus); s.start(at, 0, dur); if (dur) { g.gain.setValueAtTime(gain, at + dur - .08); g.gain.linearRampToValueAtTime(0, at + dur); } }
  function kick(at, v = .9) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(130, at); o.frequency.exponentialRampToValueAtTime(38, at + .18); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .45); o.connect(g); g.connect(music); o.start(at); o.stop(at + .5); }
  function hat(at, v = .12) { const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; const g = ctx.createGain(); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .05); s.connect(f); f.connect(g); g.connect(music); s.start(at, R() * .5, .06); }
  function drone(f, a, b, v = .16) {
    [1, 1.005, 2, 3 / 2 * 2].forEach((m, i) => { const o = ctx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f * m; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; const g = ctx.createGain(); const vv = v * (i < 2 ? 1 : .35); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(vv, a + .25); g.gain.setValueAtTime(vv, b - .2); g.gain.linearRampToValueAtTime(0, b + .1); o.connect(lp); lp.connect(g); g.connect(music); o.start(a); o.stop(b + .2); });
  }
  // harmonia: Ré menor → Si bemol → Sol → Lá → Ré
  drone(73.42, 0, 10.2); drone(58.27, 10.2, 14.4); drone(49.0, 14.4, 20.4); drone(55.0, 20.4, 23.4); drone(73.42, 23.4, 28.8, .13);
  for (let i = 0; i < 48; i++) {
    const at = i * B;
    if (at < 3.0) { if (i % 4 == 0) kick(at, .7); continue; }
    if (at >= 23.4 && at < 25.8) { kick(at, .95); kick(at + .17, .55); continue; }        // batimento cardíaco
    if (at >= 27.0) continue;
    kick(at, i % 2 ? .6 : .85);
    if (at >= 5.4) { hat(at + B / 2); if (at >= 12.6 && at < 20.4) { hat(at + B / 4, .06); hat(at + 3 * B / 4, .06); } }
  }
  // efeitos (biblioteca CC0 da skill sound-effects)
  play('boom', 0.0, .7);
  play('swoosh', 2.25, .8); play('impact', 3.0, .9);
  play('whoosh', 3.6, .8);
  play('swoosh', 4.95, .8); play('impact', 5.4, .9);
  for (let k = 0; k < 16; k++) play('tick', 5.6 + k * .11, .5);
  play('whoosh', 6.6, .8); play('whoosh', 8.25, .6);
  play('pop', 8.45, .7); play('pop', 9.05, .7);
  play('riser', 8.0, .55, 2.2);
  play('hit', 10.2, .9, 1.6); play('impact', 10.8, .8); play('impact', 11.4, .8); play('whoosh', 11.6, .5);
  play('glitch', 12.6, .45, .25); play('glitch', 13.2, .4, .15); play('glitch', 13.8, .4, .18); play('boom', 12.6, .6);
  play('impact', 14.4, .9); play('whoosh', 14.45, .6);
  for (let k = 0; k < 6; k++) play('coin', 15.0 + k * .1 + .12, .55, undefined, 1 + k * .04);
  play('impact', 15.6, .8);
  play('impact', 16.8, .9); play('impact', 18.0, .9); play('pop', 18.3, .6);
  for (let k = 0; k < 11; k++) play('pop', 19.25 + k * .045, .35, undefined, 1 + k * .03);
  play('swoosh', 20.4, .7); play('boom', 21.0, .6);
  play('hit', 23.4, .8, 1.4);
  play('swoosh', 25.55, .8); play('hit', 26.0, .9, 2.5);
  for (let k = 0; k < 26; k++) play('tick', 26.9 + k * 1 / 26, .45);
  play('coin', 27.95, .6, undefined, .8);
};

// ================= PREVIEW =================
let buf, ac, src, startAt = 0, offset = 0, playing = false;
async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; }
function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
if (!location.search.includes('render')) {
  const st = document.getElementById('stage'), fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 50) / H); st.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tc = document.getElementById('tc');
  pp.onclick = () => { playing ? pause() : play(); pp.textContent = playing ? '❚❚' : '▶'; };
  sc.oninput = () => { const p = playing; pause(); offset = sc.value / 1000 * DUR; if (p) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t / DUR * 1000; tc.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
} else seek(0);
