// ================= ÁUDIO =================
function b64buf(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }

  const sfx = {}; for (const k in SFX) sfx[k] = await ctx.decodeAudioData(b64buf(SFX[k]));
  const vo = await ctx.decodeAudioData(b64buf(VO));
  const master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  const music = ctx.createGain(); music.connect(master);
  const fxBus = ctx.createGain(); fxBus.gain.value = .55; fxBus.connect(master);
  const voBus = ctx.createGain(); voBus.gain.value = 1.35; voBus.connect(master);
  { const s = ctx.createBufferSource(); s.buffer = vo; s.connect(voBus); s.start(0); }
  // ducking: música baixa por baixo de cada frase; pausa dramática em "Everyone says crypto is dead"
  const mg = music.gain; mg.setValueAtTime(.42, 0);
  for (const [a, d] of LINES) { mg.setTargetAtTime(.2, a - .05, .04); mg.setTargetAtTime(.36, a + d, .15); }
  mg.setTargetAtTime(0, 22.8, .03); mg.setTargetAtTime(.3, 24.45, .02); mg.setTargetAtTime(0, 32.4, .3);
  const R = rng(42), noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const play = (n, at, g = 1, dur, rate = 1) => { const s = ctx.createBufferSource(); s.buffer = sfx[n]; s.playbackRate.value = rate; const gg = ctx.createGain(); gg.gain.value = g; s.connect(gg); gg.connect(fxBus); s.start(at, 0, dur); if (dur) { gg.gain.setValueAtTime(g, at + dur - .08); gg.gain.linearRampToValueAtTime(0, at + dur); } };
  const kick = (at, v = .9) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(42, at + .12); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .35); o.connect(g); g.connect(music); o.start(at); o.stop(at + .4); };
  const clap = (at, v = .5) => { const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .8; const g = ctx.createGain(); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .18); s.connect(f); f.connect(g); g.connect(music); s.start(at, R() * .5, .2); };
  const hat = (at, v = .12) => { const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000; const g = ctx.createGain(); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .04); s.connect(f); f.connect(g); g.connect(music); s.start(at, R() * .5, .05); };
  const bass = (at, f, len, v = .45) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f * 1.5, at); o.frequency.exponentialRampToValueAtTime(f, at + .06); g.gain.setValueAtTime(v, at); g.gain.setTargetAtTime(0, at + len - .1, .08); const ws = ctx.createWaveShaper(); const cu = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; cu[i] = Math.tanh(x * 2.2); } ws.curve = cu; o.connect(ws); ws.connect(g); g.connect(music); o.start(at); o.stop(at + len + .3); };
  const pluck = (at, f, v = .07) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .35); o.connect(g); g.connect(music); o.start(at); o.stop(at + .4); };
  // trap a 140 BPM: Lá menor (Lá–Fá–Dó–Sol, 1 compasso cada)
  const B = 60 / 140, BAR = B * 4, roots = [55, 43.65, 65.41, 49.0], mel = [[440, 523.25, 659.25], [349.23, 440, 523.25], [392, 523.25, 659.25], [392, 493.88, 587.33]];
  for (let bar = 0; bar * BAR < 32.4; bar++) {
    const t0 = bar * BAR, ch = bar % 4;

    mel[ch].forEach((f, i) => pluck(t0 + i * B * 1.5 + B * .5, f));

  play('swoosh', 12.15, .6); play('impact', 12.62, .9); play('hit', 13.38, .7, 1); play('pop', 14.3, .7); play('pop', 14.66, .6); play('pop', 14.95, .7); play('pop', 15.4, .6);
  play('coin', 16.1, .6); play('coin', 16.28, .6, undefined, 1.2);
  play('whoosh', 16.5, .6); play('impact', 17.9, 1); play('swoosh', 19.65, .6);
  for (let k = 0; k < 7; k++) play('click', 20.2 + k * .08, .5);
  play('impact', 21.66, .8); play('impact', 23.3, .9); play('impact', 23.5, .9); play('impact', 23.7, .9);
  play('riser', 22.95, .5, 1.5); play('boom', 24.5, .6, 1.4);
  play('whoosh', 25.2, .5); play('pop', 26.65, .7); play('impact', 26.7, .6);

  for (let k = 0; k < 15; k++) play('tick', 30.55 + k * .056, .45);

// ================= PREVIEW =================
let buf, ac, src, startAt = 0, offset = 0, playing = false;
async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; }
function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
if (!location.search.includes('render')) {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tcEl = document.getElementById('tc');
  pp.onclick = () => { playing ? pause() : play(); pp.textContent = playing ? '❚❚' : '▶'; };
  sc.oninput = () => { const p = playing; pause(); offset = sc.value / 1000 * DUR; if (p) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t / DUR * 1000; tcEl.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
} else seek(0);
