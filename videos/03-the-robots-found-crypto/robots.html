  const clap = (at, v = .45) => { const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .8; const g = ctx.createGain(); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .2); s.connect(f); f.connect(g); g.connect(music); s.start(at, R() * .5, .22); };
  const hat = (at, v = .1) => { const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000; const g = ctx.createGain(); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .04); s.connect(f); f.connect(g); g.connect(music); s.start(at, R() * .5, .05); };
  const bass = (at, f, len, v = .42) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f * 1.5, at); o.frequency.exponentialRampToValueAtTime(f, at + .06); g.gain.setValueAtTime(v, at); g.gain.setTargetAtTime(0, at + len - .1, .08); const ws = ctx.createWaveShaper(), cu = new Float32Array(256); for (let i = 0; i < 256; i++) cu[i] = Math.tanh((i / 128 - 1) * 2.2); ws.curve = cu; o.connect(ws); ws.connect(g); g.connect(music); o.start(at); o.stop(at + len + .3); };
  const pad = (at, fs, len, v = .035) => fs.forEach(f => { const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 1400; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(v, at + .4); g.gain.setValueAtTime(v, at + len - .3); g.gain.linearRampToValueAtTime(0, at + len); o.connect(lp); lp.connect(g); g.connect(music); o.start(at); o.stop(at + len + .1); });
  const pluck = (at, f, v = .06) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(.001, at + .3); o.connect(g); g.connect(music); o.start(at); o.stop(at + .35); };
  // 140 BPM, Mi menor (Mi–Dó–Sol–Ré), pad suave por baixo para dar fluidez
  const B = 60 / 140, BAR = B * 4, roots = [41.2, 32.7, 49.0, 36.71], chords = [[329.63, 392, 493.88], [261.63, 329.63, 392], [392, 493.88, 587.33], [293.66, 369.99, 440]];
  for (let bar = 0; bar * BAR < 36.6; bar++) {
    const t0 = bar * BAR, ch = bar % 4;
    pad(t0, chords[ch], BAR + .05);
    bass(t0, roots[ch] * 2, B * 2.5); bass(t0 + B * 2.75, roots[ch] * 2, B * 1.2, .32);
    kick(t0); kick(t0 + B * 2.5, .65); clap(t0 + B * 2);
    for (let i = 0; i < 8; i++) { hat(t0 + i * B / 2, i % 2 ? .06 : .1); if (bar % 2 && i == 7) for (let r = 1; r < 4; r++) hat(t0 + i * B / 2 + r * B / 8, .05); }
    [0, 1.5, 3].forEach((b, i) => pluck(t0 + b * B, chords[ch][i] * 2));
  }
  // efeitos (CC0, skill sound-effects)
  play('impact', 0.02, .7); play('glitch', 2.0, .3, .25); play('impact', 2.05, .8); play('whoosh', 2.2, .5);
  play('swoosh', 3.4, .5); play('hit', 5.08, .7, 1.2); play('boom', 5.4, .5, 1.2);
  for (let k = 0; k < 3; k++) play('pop', 6.4 + k * .15, .6);
  for (let k = 0; k < 13; k++) play('tick', 7.3 + k * .1, .4);
  play('impact', 8.5, .6); play('pop', 10.3, .7);
  play('swoosh', 11.3, .5); for (let k = 0; k < 3; k++) play('pop', 11.8 + k * .2, .55, undefined, 1 + k * .08); play('impact', 12.48, .7);
  play('whoosh', 13.3, .5); play('pop', 13.4, .5); play('pop', 14.16, .5);
  for (let k = 0; k < 6; k++) play('coin', 15.0 + k * .9 + .45, .4, undefined, 1 + (k % 2) * .1);
  play('swoosh', 16.15, .5); for (let k = 0; k < 8; k++) play('tick', 17.6 + k * .09, .4); play('impact', 17.9, .5);
  play('riser', 19.0, .35, 1.1); play('hit', 20.16, .7, 1.2); for (let k = 0; k < 6; k++) play('tick', 20.12 + k * .07, .4, undefined, 1.3);
  play('swoosh', 21.2, .5); play('whoosh', 21.55, .5); play('click', 22.8, 1); play('pop', 22.82, .6);
  play('swoosh', 23.25, .5); play('glitch', 24.1, .3, .2); play('glitch', 26.04, .3, .12); play('impact', 26.04, .7);
  for (let k = 0; k < 16; k++) play('click', 27.25 + k * .04, .35);
  play('impact', 28.6, .6); play('swoosh', 29.65, .5); play('impact', 30.68, .9); play('riser', 30.9, .35, .9); play('boom', 31.36, .5, 1.2);
  play('swoosh', 32.45, .6); play('hit', 32.9, .6, 1.4); play('pop', 32.8, .5); play('pop', 33.3, .5); play('pop', 33.85, .5);
  for (let k = 0; k < 15; k++) play('tick', 34.75 + k * .056, .4);
  play('click', 36.0, .9); play('coin', 36.05, .55, undefined, .9);
};

// ================= PREVIEW =================
let buf, ac, src, startAt = 0, offset = 0, playing = false;
async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; }
function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
if (!location.search.includes('render')) {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tcEl = document.getElementById('tc');
  pp.onclick = () => { playing ? pause() : play(); pp.textContent = playing ? '❚❚' : '▶'; };
  sc.oninput = () => { const p = playing; pause(); offset = sc.value / 1000 * DUR; if (p) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t / DUR * 1000; tcEl.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
} else seek(0);
</script>
