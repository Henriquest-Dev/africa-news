<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Inteligência a Dobrar</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; background: #222; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #f7f3e8; }
  svg { position: absolute; left: 0; top: 0; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px; background: #000c; color: #ddd; font: 13px system-ui; display: flex; gap: 10px; align-items: center; }
  #ui input { flex: 1; } .render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<div id="ui"><button id="pp">▶</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0.00</span></div>
<script src="stick.js"></script>
<script src="timing.js"></script>
<script src="sfx.js"></script>
<script src="vo.js"></script>
<script>
/* "E se a tua inteligência dobrasse todos os dias?" — 16:9, 8:00.
   Fundos: 9 cenários a traço gerados na Pollinations (flux.1-schnell). Personagens: stickman desenhado em código no estilo
   das folhas de referência (poses + 35 expressões), com traço "a ferver" (boil) a 8 imagens/s como animação desenhada à mão.
   Cada frase da narração (87) tem uma cena própria: BEATS[i]. */
const W = 1920, H = 1080, DUR = TL.dur, FLOOR = 930;
window.VIDEO = { w: W, h: H, duration: DUR };
if (location.search.includes('render')) document.documentElement.classList.add('render');
const sv = document.getElementById('sv');
const kp = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; if (t <= b) return lerp(va, vb, ease((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const fmt = n => Math.round(n).toLocaleString('pt-PT').replace(/\./g, ' ').replace(/ /g, ' ');
const IQ = d => 100 * Math.pow(2, d);

// ---------- defs: traço a ferver ----------
const defs = S('defs', {}, sv);
for (let i = 0; i < 3; i++) { const f = S('filter', { id: 'boil' + i, x: '-10%', y: '-10%', width: '120%', height: '120%' }, defs); S('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.022', numOctaves: 2, seed: 3 + i * 7, result: 'n' }, f); S('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale: 4.5 }, f); }
// ---------- camadas ----------
const cam = S('g', {}, sv);
const bgImg = S('image', { x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'xMidYMid slice', opacity: .62 }, cam);
const bgPaper = S('g', {}, cam);
const world = S('g', {}, cam);
const hud = S('g', {}, sv), card = S('g', {}, sv);
// fundos procedimentais (papel, espaço, cosmos)
const PAPER = {
  paper: g => { for (let i = 0; i < 26; i++) { const x = 60 + (i * 397) % 1800, y = 60 + (i * 251) % 960; S('path', { ...INK, 'stroke-width': 3, opacity: .18, d: i % 3 ? `M${x} ${y} q20 -20 40 0 t40 0` : `M${x - 14} ${y} L${x + 14} ${y} M${x} ${y - 14} L${x} ${y + 14}` }, g); } },
  space: g => { for (let i = 0; i < 70; i++) { const x = (i * 271) % 1920, y = (i * 173) % 820, r = 2 + (i % 4); S('path', { ...INK, 'stroke-width': 3, d: i % 5 ? `M${x - r} ${y} L${x + r} ${y} M${x} ${y - r} L${x} ${y + r}` : `M${x} ${y - 9} L${x + 3} ${y - 3} L${x + 9} ${y} L${x + 3} ${y + 3} L${x} ${y + 9} L${x - 3} ${y + 3} L${x - 9} ${y} L${x - 3} ${y - 3} Z` }, g); }
    S('circle', { ...INK, cx: 1600, cy: 260, r: 120, fill: '#dff1ff' }, g); S('path', { ...INK, 'stroke-width': 4, d: 'M1500 220 q40 -30 70 0 t60 20 M1530 320 q30 20 60 0 t40 -30' }, g); S('path', { ...INK, 'stroke-width': 4, d: 'M0 ' + (FLOOR + 10) + ' Q960 ' + (FLOOR - 40) + ' 1920 ' + (FLOOR + 10) }, g); },
  cosmos: g => { for (let a = 0; a < 3; a++) S('path', { ...INK, 'stroke-width': 4, opacity: .5, d: Array.from({ length: 90 }, (_, i) => { const th = i * .18 + a * 2.1, r = 8 + i * 6; return (i ? 'L' : 'M') + (960 + Math.cos(th) * r).toFixed(1) + ' ' + (420 + Math.sin(th) * r * .55).toFixed(1); }).join(' ') }, g); PAPER.space(g); },
};
const paperGroups = {}; for (const k in PAPER) { paperGroups[k] = S('g', { visibility: 'hidden' }, bgPaper); PAPER[k](paperGroups[k]); }

// ---------- helpers de cena ----------
function T(g, str, x, y, size = 64, o = {}) { const t = S('text', { x, y, 'text-anchor': o.anchor || 'middle', 'font-family': o.font || 'Patrick Hand', 'font-size': size, fill: o.fill || '#111' }, g); t.textContent = str; if (o.stroke) { t.setAttribute('stroke', '#fffdf7'); t.setAttribute('stroke-width', 10); t.setAttribute('paint-order', 'stroke'); } return t; }
function typeOn(el, full, lt, t0, cps = 22) { const n = Math.floor(clamp((lt - t0) * cps, 0, full.length)); el.textContent = full.slice(0, n); el.setAttribute('visibility', lt >= t0 ? 'visible' : 'hidden'); }
function pop(el, lt, t0, x, y, s = 1, r = 0) { const k = lt < t0 ? 0 : spring(lt - t0, 16, .55); el.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${(k * s).toFixed(3)})`); el.setAttribute('visibility', k > .01 ? 'visible' : 'hidden'); }
function place(el, x, y, s = 1, r = 0, vis = true) { el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)}) scale(${s})`); el.setAttribute('visibility', vis ? 'visible' : 'hidden'); }
function drawOn(p, lt, t0, t1) { const L = p.__L ??= p.getTotalLength(); const k = seg(lt, t0, t1); p.setAttribute('stroke-dasharray', `${L} ${L}`); p.setAttribute('stroke-dashoffset', L * (1 - k)); p.setAttribute('visibility', k > 0 ? 'visible' : 'hidden'); }
function line(g, d, w = 6, o = {}) { return S('path', { ...INK, 'stroke-width': w, d, ...o }, g); }
function hl(g, str, x, y, size = 70, o = {}) {   // palavra com marcador amarelo por trás
  const gg = S('g', {}, g), r = S('rect', { x: 0, y: -size * .72, height: size * .9, width: 0, fill: o.color || '#ffe066', transform: 'skewX(-8)' }, gg), t = T(gg, str, 0, 0, size, { font: o.font || 'Permanent Marker', anchor: 'start' });
  return lt => { const w = t.getComputedTextLength(); gg.setAttribute('transform', `translate(${x - w / 2} ${y})`); const k = seg(lt, o.t0 || 0, (o.t0 || 0) + .35); r.setAttribute('width', (w + 24) * k); r.setAttribute('x', -12); gg.setAttribute('visibility', lt >= (o.t0 || 0) ? 'visible' : 'hidden'); t.setAttribute('opacity', clamp((lt - (o.t0 || 0)) / .15)); };
}
// pose com transições suaves: keys [[t, 'pose' | objeto], ...]
function P(lt, keys, blend = .32) { let cur = keys[0][1]; let pose = typeof cur === 'string' ? POSES[cur] : cur;
  for (let i = 1; i < keys.length; i++) { const [tk, pk] = keys[i]; if (lt < tk) break; const nxt = typeof pk === 'string' ? POSES[pk] : pk; pose = mixPose(pose, nxt, ease(seg(lt, tk, tk + blend))); }
  return pose; }
const Ex = (lt, keys) => { let e = keys[0][1]; for (const [tk, k] of keys) if (lt >= tk) e = k; return e; };
const wobble = (pose, lt, a = 6) => ({ ...pose, aR: [pose.aR[0] + Math.sin(lt * 9) * a, pose.aR[1] + Math.sin(lt * 9 + 1) * a] });   // gesto ao falar

// ---------- PROTAGONISTA ----------
const heroLayer = S('g', {}, world);
const HERO = makeStick(heroLayer, { seed: 1 });
const aura = S('g', {}, heroLayer); for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; S('path', { ...INK, 'stroke-width': 5, d: `M${Math.cos(a) * 80} ${Math.sin(a) * 80} L${Math.cos(a) * 104} ${Math.sin(a) * 104}` }, aura); }
let curDay = 0;
function hero(x, pose, expr, lt, o = {}) {
  const hs = 1 + Math.min(.42, Math.log2(curDay + 1) * .085) * (o.noGrow ? 0 : 1);
  drawStick(HERO, x, o.y ?? FLOOR, pose, expr, { s: o.s || 1.15, t: lt + 7, headScale: hs * (o.hs || 1), rot: o.rot || 0, flip: o.flip, headTilt: o.tilt || 0 });
  const hp = HERO.handPos.head, s = o.s || 1.15;
  const on = curDay >= 10 && !o.noGrow; aura.setAttribute('visibility', on ? 'visible' : 'hidden');
  if (on) aura.setAttribute('transform', `translate(${x + hp[0] * s} ${(o.y ?? FLOOR) + hp[1] * s}) rotate(${lt * 20}) scale(${hs * s * (1 + Math.sin(lt * 4) * .05)})`);
}
// atores secundários reutilizáveis por cena
function actor(g, acc, seed) { return makeStick(g, { acc, seed }); }

// ---------- BEATS (uma cena por frase) ----------
// cada beat: (g) => (lt, d) => {...}   g = grupo próprio; lt = tempo local; d = duração até à frase seguinte
const BEATS = [];
const B = fn => BEATS.push(fn);

// ===== INTRO (papel) =====
B(g => { const h = hl(g, 'INTELIGÊNCIA × 2', 960, 200, 90), d1 = T(g, 'TODOS OS DIAS', 960, 290, 60); const br = S('g', {}, g); S('path', { ...INK, fill: '#ffd1dc', d: 'M-60 0 C-90 -60 -30 -100 0 -70 C30 -100 90 -60 60 0 C80 40 30 70 0 50 C-30 70 -80 40 -60 0 Z' }, br); line(br, 'M0 -70 L0 50 M-40 -30 q20 10 0 30 M40 -30 q-20 10 0 30', 4);
  return lt => { h(lt); typeOn(d1, 'TODOS OS DIAS', lt, 1.0); hero(760, P(lt, [[0, 'stand'], [0.4, 'think']]), Ex(lt, [[0, 'calm'], [1.1, 'curious']]), lt); pop(br, lt, .6, 1250, 640, 1 + seg(lt, 1.5, 4) * .8); }; });
B(g => { const e = actor(g, ['wild'], 3), t = hl(g, 'DIA 1  >  EINSTEIN', 960, 180, 80, { t0: 1.4 });
  return lt => { hero(700, P(lt, [[0, 'stand'], [1.2, 'hips']]), Ex(lt, [[0, 'calm'], [1.2, 'confident']]), lt); drawStick(e, 1250, FLOOR, P(lt, [[0, 'stand'], [1.6, 'shrug']]), Ex(lt, [[0, 'calm'], [1.6, 'shocked']]), { s: 1.1, t: lt }); t(lt); }; });
B(g => { const t = hl(g, 'DIA 30 = ???', 960, 170, 96, { t0: .3 });
  return lt => { t(lt); const hs = 1 + seg(lt, .5, 3) * .9; hero(960, P(lt, [[0, 'stand'], [1, 'scared']]), Ex(lt, [[0, 'calm'], [1.2, 'shocked']]), lt, { hs, noGrow: true }); }; });
B(g => { const crowd = [[260, ['hair']], [470, ['glasses', 'tie']], [1450, ['bun']], [1660, ['tie']]].map(([x, a], i) => ({ x, c: actor(g, a, 10 + i) }));
  return lt => { hero(960, P(lt, [[0, 'stand'], [2.5, 'scared']]), Ex(lt, [[0, 'confident'], [2.6, 'nervous']]), lt);
    crowd.forEach((p, i) => drawStick(p.c, p.x + (p.x < 960 ? 1 : -1) * seg(lt, 2.4, 4) * 120, FLOOR, P(lt, [[0, 'stand'], [2.5 + i * .1, p.x < 960 ? 'point' : 'pointL']]), Ex(lt, [[0, 'calm'], [2.5, 'scared']]), { s: .95, t: lt + i })); }; });
B(g => { const btn = prop(g, 'button');
  return lt => { pop(btn, lt, .2, 1180, FLOOR - 230, 1.6); hero(820, P(lt, [[0, 'stand'], [1.2, 'point']]), Ex(lt, [[0, 'curious'], [1.2, 'pensive']]), lt); }; });
B(g => { const b = prop(g, 'bulbOff'), q = T(g, '?', 1230, 400, 160, { font: 'Permanent Marker' });
  return lt => { hero(900, P(lt, [[0, 'think']]), Ex(lt, [[0, 'pensive'], [2, 'confused']]), lt); pop(b, lt, .5, 1110, 420, 1.2); place(q, 0, Math.sin(lt * 3) * 10, 1, 0, lt > 1); }; });
B(g => { const pages = [0, 1, 2].map(i => { const gg = S('g', {}, g); S('rect', { ...INK, fill: '#fffdf7', x: -90, y: -110, width: 180, height: 220 }, gg); T(gg, 'DIA ' + [0, 1, 2][i], 0, 20, 64, { font: 'Permanent Marker' }); return gg; });
  return lt => { hero(lerp(300, 1500, seg(lt, 0, 2.2)), walkPose(lt), 'happy', lt); pages.forEach((p, i) => { const k = seg(lt, .3 + i * .5, .7 + i * .5); place(p, 1500, 330 - k * 60, 1, -k * 25 * (2 - i), lt > .2); p.setAttribute('opacity', 1 - (i < 2 ? k : 0)); }); }; });

// ===== DIA 0 (quarto) =====
B(g => { const m = T(g, 'QI: 100', 1320, 380, 80, { font: 'Permanent Marker' }), avg = T(g, '(a média)', 1320, 450, 52);
  return lt => { hero(800, P(lt, [[0, 'stand'], [.4, 'wave'], [2.2, 'hips']]), Ex(lt, [[0, 'happy'], [3, 'calm']]), lt); m.setAttribute('visibility', lt > 1.6 ? 'visible' : 'hidden'); typeOn(avg, '(a média)', lt, 3.4); }; });
B(g => { const k = prop(g, 'key'), ph = prop(HERO.hand.R, 'phone'), qs = [0, 1, 2].map(i => T(g, '?', 0, 0, 90, { font: 'Permanent Marker' }));
  return lt => { hero(900, P(lt, [[0, 'confused'], [2.2, 'phone']]), Ex(lt, [[0, 'confused'], [2.4, 'incredulous']]), lt); place(k, 1200, FLOOR - 10, 1.2, 20, lt < 2.4); ph.setAttribute('visibility', lt > 2.2 ? 'visible' : 'hidden'); qs.forEach((q, i) => place(q, 760 + i * 120, 330 - Math.sin(lt * 3 + i) * 15, 1, (i - 1) * 12, lt > .5 + i * .3)); }; });
B(g => { const bed = S('g', {}, g), sp = [0, 1, 2, 3].map(i => T(g, '✦', 0, 0, 50, { fill: '#e8a800' }));
  return lt => { const lie = seg(lt, .5, 1.6); hero(lerp(900, 1050, lie), P(lt, [[0, 'stand'], [.5, 'sad']]), Ex(lt, [[0, 'tired'], [1.6, 'sleep']]), lt, { rot: -90 * ease(lie), y: lerp(FLOOR, 800, ease(lie)) });
    sp.forEach((s, i) => place(s, 790 + Math.cos(lt * 2 + i * 1.6) * 90, 690 + Math.sin(lt * 2 + i * 1.6) * 50, 1, 0, lt > 2.5)); HERO.handPos && 0; }; });

// ===== DIA 1 (quarto) =====
B(g => { return lt => { const up = seg(lt, 1.6, 2.1); hero(960, P(lt, [[0, 'stand'], [1.6, 'celebrate']]), Ex(lt, [[0, 'shocked'], [1.8, 'excited']]), lt, { y: FLOOR - Math.sin(up * Math.PI) * 120 }); }; });
B(g => { const bars = [['TU ONTEM', 100], ['EINSTEIN*', 160], ['TU HOJE', 200]].map(([n, v], i) => { const gg = S('g', {}, g); const r = S('rect', { ...INK, fill: i === 2 ? '#ffe066' : '#fffdf7', x: -60, y: 0, width: 120, height: 0 }, gg); const l = T(gg, n, 0, 50, 40); const vt = T(gg, String(v), 0, 0, 52, { font: 'Permanent Marker' }); return { gg, r, vt, v }; }); const note = T(g, '*estimativa, nunca foi medido', 1350, 1010, 32);
  return lt => { bars.forEach((b, i) => { const k = ease(seg(lt, .4 + i * .5, 1.2 + i * .5)), hgt = b.v * 2.4 * k; b.r.setAttribute('y', -hgt); b.r.setAttribute('height', hgt); b.vt.setAttribute('y', -hgt - 18); place(b.gg, 1100 + i * 220, FLOOR - 40, 1, 0, lt > .3 + i * .5); }); hero(560, P(lt, [[0, 'stand'], [.6, 'presentL'], [1.4, 'present']]), Ex(lt, [[0, 'confident']]), lt); note.setAttribute('visibility', lt > 1.6 ? 'visible' : 'hidden'); }; });
B(g => { const cube = prop(HERO.hand.R, 'cube'), t = hl(g, '3 SEGUNDOS', 1350, 300, 80, { t0: 3.4 });
  return lt => { hero(860, P(lt, [[0, 'stand'], [.8, 'phone']]), Ex(lt, [[0, 'curious'], [2.5, 'confident']]), lt); cube.setAttribute('visibility', lt > .8 ? 'visible' : 'hidden'); cube.setAttribute('transform', `rotate(${lt > 2 && lt < 3.4 ? lt * 900 : 0}) scale(1.1)`); t(lt); }; });
B(g => { const bk = prop(HERO.hand.R, 'book'), pages = T(g, 'pág. 1', 1300, 420, 60, { font: 'Permanent Marker' });
  return lt => { hero(900, P(lt, [[0, 'read']]), Ex(lt, [[0, 'pensive'], [2.2, 'happy']]), lt); bk.setAttribute('transform', 'translate(-30 -30) scale(1.3)'); pages.textContent = 'pág. ' + Math.min(342, Math.floor(lt * 140)); }; });
B(g => { const cl = [0, 1, 2].map(i => line(g, `M${-90} 0 q20 -40 50 -20 q20 -40 60 -10 q40 -10 40 30 Z`, 5)); const tl = S('g', {}, g); S('rect', { ...INK, fill: '#fffdf7', x: -30, y: -90, width: 60, height: 170, rx: 14 }, tl); const lamps = [0, 1, 2].map(i => S('circle', { cx: 0, cy: -55 + i * 52, r: 20, stroke: '#111', 'stroke-width': 5, fill: '#fffdf7' }, tl)); line(tl, 'M0 80 L0 260');
  return lt => { hero(lerp(400, 1000, seg(lt, 0, 3)), lt < 3 ? walkPose(lt, .8) : POSES.stand, Ex(lt, [[0, 'curious'], [3, 'excited']]), lt, { tilt: -10 }); cl.forEach((c, i) => place(c, 300 + i * 500 + lt * 30, 220 + i * 40, 1.4, 0, true)); place(tl, 1550, 600, 1, 0, true); lamps.forEach((l, i) => l.setAttribute('fill', Math.floor(lt * 1.5) % 3 === i ? ['#ff5a4f', '#ffd23f', '#7ddc7a'][i] : '#fffdf7')); }; });
B(g => { const b = prop(g, 'bulb');
  return lt => { hero(960, P(lt, [[0, 'stand'], [.3, 'celebrate']]), Ex(lt, [[0, 'excited']]), lt, { y: FLOOR - Math.abs(Math.sin(lt * 5)) * 40 * (lt < 1.6) }); pop(b, lt, .2, 960, 260, 1.5); }; });

// ===== DIA 2 (sala de aula) =====
B(g => { return lt => { hero(960, P(lt, [[0, 'stand'], [.6, 'hips']]), Ex(lt, [[0, 'confident']]), lt); }; });
B(g => { const tch = actor(g, ['glasses', 'tie'], 20), eq = T(g, '2 + 2 = 5', 880, 300, 70, { font: 'Patrick Hand', fill: '#fff' }), x = line(g, 'M800 250 L980 320 M980 250 L800 320', 9, { stroke: '#ff5a4f' });
  return lt => { drawStick(tch, 560, FLOOR, P(lt, [[0, 'write']]), 'serious', { s: 1.05, t: lt }); typeOn(eq, '2 + 2 = 5', lt, .2, 8); hero(1350, P(lt, [[0, 'stand'], [.7, 'raise']]), Ex(lt, [[0, 'confident']]), lt); drawOn(x, lt, 1.0, 1.4); }; });
B(g => { const tch = actor(g, ['glasses', 'tie'], 21), clock = T(g, '0:00', 1380, 280, 90, { font: 'Permanent Marker' }), paper = prop(HERO.hand.R, 'notebook');
  return lt => { hero(1000, P(lt, [[0, 'sitWrite']]), Ex(lt, [[0, 'confident']]), lt); clock.textContent = '0:0' + Math.min(5, Math.floor(lt * 2.2)); drawStick(tch, 520, FLOOR, P(lt, [[0, 'cross'], [2.3, 'pointL']]), Ex(lt, [[0, 'serious'], [2.3, 'angry']]), { s: 1.05, t: lt }); paper.setAttribute('transform', 'scale(.8)'); }; });
B(g => { const tch = actor(g, ['glasses', 'tie'], 22), ws = ['1)  a² + b²', '2)  ∫ f(x) dx', '3)  √49 = 7'].map((s, i) => T(g, s, 760, 230 + i * 70, 54, { fill: '#fff', anchor: 'start' }));
  return lt => { hero(600, P(lt, [[0, 'write'], [2.5, 'presentL']]), Ex(lt, [[0, 'confident'], [3, 'smug']]), lt); ws.forEach((w, i) => typeOn(w, ['1)  a² + b²', '2)  ∫ f(x) dx', '3)  √49 = 7'][i], lt, .3 + i * .8, 18)); drawStick(tch, 1450, FLOOR, P(lt, [[0, 'stand'], [2.5, 'scared']]), Ex(lt, [[0, 'incredulous'], [2.6, 'shocked']]), { s: 1.05, t: lt }); }; });
B(g => { const words = ['Hello!', 'Hola!', 'Bonjour!', 'Ciao!', 'Hallo!', 'Salut!'].map((w, i) => { const gg = S('g', {}, g); S('path', { ...INK, 'stroke-width': 5, fill: '#fffdf7', d: 'M-110 -50 Q-110 -90 0 -90 Q110 -90 110 -50 Q110 -10 20 -10 L0 20 L-10 -10 Q-110 -10 -110 -50 Z' }, gg); T(gg, w, 0, -38, 46); return gg; });
  return lt => { hero(960, wobble(POSES.talk, lt), Ex(lt, [[0, 'happy'], [3.5, 'bored']]), lt); words.forEach((w, i) => pop(w, lt, .4 + i * .65, [520, 1400, 400, 1520, 600, 1320][i], [300, 280, 520, 500, 160, 140][i], 1, (i % 2 ? 6 : -6))); }; });
B(g => { const f1 = actor(g, ['hair'], 30), f2 = actor(g, ['bun'], 31);
  return lt => { hero(960, P(lt, [[0, 'stand'], [1.2, 'sad']]), Ex(lt, [[0, 'happy'], [1.2, 'sad']]), lt); drawStick(f1, 520 - seg(lt, 1, 3) * 80, FLOOR, P(lt, [[0, 'stand'], [.6, 'cross']]), 'incredulous', { s: 1.05, t: lt }); drawStick(f2, 1400 + seg(lt, 1, 3) * 80, FLOOR, P(lt, [[0, 'stand'], [.8, 'hips']]), 'confused', { s: 1.05, t: lt + 2 }); }; });

// ===== DIA 3 (biblioteca) =====
B(g => { return lt => { hero(960, P(lt, [[0, 'stand'], [.5, 'read']]), 'pensive', lt); }; });
B(g => { const books = Array.from({ length: 14 }, (_, i) => prop(g, 'book'));

  play('boom', TL.lines[77][0], .5); play('click', TL.lines[79][0] + 2.2, .7);
};

// ================= PREVIEW =================
let buf, ac, src, startAt = 0, offset = 0, playing = false;
async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; }
function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
if (!location.search.includes('render')) {
  const st = document.getElementById('stage'), fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 40) / H); st.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tcEl = document.getElementById('tc');
  pp.onclick = () => { playing ? pause() : play(); pp.textContent = playing ? '❚❚' : '▶'; };
  sc.oninput = () => { const p = playing; pause(); offset = sc.value / 1000 * DUR; if (p) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t / DUR * 1000; tcEl.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
} else seek(0);
</script>
