<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Zinho, o Sortudo — render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; font-family: Inter, 'DejaVu Sans', sans-serif; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ov { position: absolute; pointer-events: none; }

  /* contador do canto */
  #hud { z-index: 4; left: 2.2vw; top: 3vh; display: flex; align-items: center; gap: 0.9vw; padding: 1vh 1.3vw 1vh 1vw;
    background: rgba(18, 18, 24, 0.82); border: 0.25vh solid rgba(255,255,255,0.12); border-radius: 1.2vh; transform-origin: left top; }
  #hud svg { width: 5vh; height: 5vh; }
  #hud .day { font: 700 2vh 'JetBrains Mono', monospace; color: #b9b9c6; letter-spacing: .15em; }
  #hud .val { font: 800 4.2vh 'JetBrains Mono', monospace; letter-spacing: .04em; }
  #hud.azar .val { color: #ff4d4d; text-shadow: 0 0 1.2vh rgba(255, 60, 60, .55); }
  #hud.pessoas .val { color: #e8ecff; font-size: 3.2vh; text-shadow: 0 0 1.2vh rgba(180, 200, 255, .5); }
  #hud.ouro .val { color: #ffd23f; text-shadow: 0 0 1.2vh rgba(255, 200, 40, .6); }
  #hud.sorte .val { color: #5dff8a; text-shadow: 0 0 1.2vh rgba(60, 255, 120, .55); }

  /* carimbo "DIA 3" */
  #stamp { left: 50%; top: 44%; font: 900 15vh Inter, sans-serif; color: #ffd23f; letter-spacing: -0.02em; white-space: nowrap;
    -webkit-text-stroke: 1.3vh #111; paint-order: stroke fill; text-shadow: 0 1.2vh 0 #111; transform-origin: center; }
  #stamp.red { color: #ff4040; }

  /* balão das contas da Lia */
  #calc { left: 50%; top: 9vh; transform: translateX(-50%); display: flex; gap: 1.4vw; font: 900 6.2vh Inter, sans-serif;
    color: #fff; -webkit-text-stroke: 0.7vh #111; paint-order: stroke fill; }
  #calc span { display: inline-block; }

  #flash { inset: 0; background: #fff; opacity: 0; }
  /* legendas dos Shorts */
  #cap { left: 50%; top: 66%; width: 92vw; text-align: center; font: 900 6.2vw/1.15 Inter, sans-serif; color: #fff; text-transform: uppercase;
    -webkit-text-stroke: 1.6vw #111; paint-order: stroke fill; letter-spacing: -0.01em; transform-origin: center; z-index: 5; }
  #cap span.on { color: #ffd23f; }
  #fade { inset: 0; background: #000; opacity: 0; }
  /* faixas de cinema 2.39:1 */
  #lb { inset: 0; }
  #lb .t, #lb .b { position: absolute; left: 0; right: 0; height: 12.6vh; background: #000; }
  #lb .t { top: 0; } #lb .b { bottom: 0; }
  #lb ~ #hud, #hud { z-index: 3; }
  /* cartão de título */
  #card { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-align: center; z-index: 2; }
  #card .ct { font: 800 7.5vh Inter, sans-serif; color: #fff; letter-spacing: 0.12em; text-shadow: 0 0.6vh 3vh rgba(0,0,0,.7); max-width: 80vw; }
  #card .cs { font: 500 3vh Inter, sans-serif; color: #d6d6e0; letter-spacing: 0.35em; text-transform: uppercase; text-shadow: 0 0.4vh 2vh rgba(0,0,0,.7); }
  #vignette { inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }

  /* final */
  #endcard { left: 0; right: 0; bottom: 7vh; display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  #endcard .logo { font: 900 8vh Inter, sans-serif; color: #fff; -webkit-text-stroke: 1vh #111; paint-order: stroke fill; letter-spacing: -0.01em; }
  #endcard .logo b { color: #5dff8a; }
  #endcard .bubble { font: 800 5vh Inter, sans-serif; background: #fff; color: #111; padding: 1.4vh 3vw; border-radius: 3vh; border: 0.6vh solid #111; }
  #endcard .sub { font: 900 5.2vh Inter, sans-serif; background: #e62117; color: #fff; padding: 1.6vh 3.4vw; border-radius: 1.4vh; border: 0.6vh solid #111; box-shadow: 0 0.8vh 0 #111; }
  #endcard .bell { display: inline-block; margin-left: 1vw; }
  /* formato vertical (Shorts) */
  @media (max-aspect-ratio: 1/1) {
    #stamp { font-size: 12vw; -webkit-text-stroke: 1.1vw #111; text-shadow: 0 1vw 0 #111; }
    #endcard { bottom: 12vh; }
    #endcard .logo { font-size: 9.5vw; -webkit-text-stroke: 1.2vw #111; }
    #endcard .bubble { font-size: 6.4vw; padding: 1.2vh 5vw; }
    #endcard .sub { font-size: 7vw; }
    #hud .val { font-size: 5vw; } #hud .day { font-size: 2.6vw; } #hud svg { width: 6vw; height: 6vw; }
  }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <div id="vignette" class="ov"></div>
  <div id="flash" class="ov"></div>
  <div id="fade" class="ov"></div>
  <div id="card" class="ov" style="display:none"></div>
  <div id="lb" class="ov" style="display:none"><div class="t"></div><div class="b"></div></div>
  <div id="hud" class="ov azar" style="display:none">
    <span class="icon"></span>
    <div><div class="day">DIA 0</div><div class="val">AZAR x1</div></div>
  </div>
  <div id="calc" class="ov"></div>
  <div id="cap" class="ov" style="display:none"></div>
  <div id="stamp" class="ov" style="display:none"></div>
  <div id="endcard" class="ov" style="display:none"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
